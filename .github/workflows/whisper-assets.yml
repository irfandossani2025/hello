name: Temporary Whisper Assets

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [claude/node12-plesk-setup-nYkYV]
    paths: [.github/workflows/whisper-assets.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-assets:
    runs-on: ubuntu-22.04
    steps:
      - name: Prepare asset directory
        run: mkdir -p whisper-assets

      - name: Download prebuilt whisper.cpp CPU CLI
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/KodeStar/audiosilo-sidecars/releases/download/whisper-cpp-v1.9.1-1/whisper-cli-linux-amd64-cpu.tar.gz" \
            -o /tmp/whisper-cli.tar.gz
          tar -xzf /tmp/whisper-cli.tar.gz -C whisper-assets
          chmod +x whisper-assets/whisper-cli
          whisper-assets/whisper-cli --help >/dev/null

      - name: Download multilingual Whisper small q5 model
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin" \
            -o whisper-assets/ggml-small-q5_1.bin
          test -s whisper-assets/ggml-small-q5_1.bin

      - name: Upload local transcription assets
        uses: actions/upload-artifact@v4
        with:
          name: whisper-local-assets
          path: whisper-assets/
          compression-level: 0
          retention-days: 1
